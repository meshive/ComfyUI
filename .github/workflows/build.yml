name: Build and Push Docker Images

# 수동 실행 전용. 예전에는 8시간마다 도는 schedule 이 있었는데, 이 워크플로는 한 번도 성공한 적이
# 없으면서(fork 라 Actions 미활성, 실행 이력 0, DOCKER_HUB 변수/시크릿 미설정) Actions 가 켜지거나
# fork 를 detach 하는 순간 기본 브랜치에서 13개 라이브 태그를 무인 갱신하는 지뢰였다.
# 애초에 ubuntu-latest 러너는 정리해도 ~45-60GB 라 20GB 급 이미지를 빌드할 수 없다 — 현행 이미지들은
# 전부 로컬 수동 빌드(docker buildx bake) 산물이다.
on:
  workflow_dispatch:

jobs:
  bake:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [base, slim]
        cuda: [12-4, 12-6, 12-8]
        include:
          # Blackwell (cu130) base/slim and the five bundled workflow presets.
          - target: base
            cuda: 13-0
          - target: slim
            cuda: 13-0
          - target: zit
            cuda: 13-0
          - target: flux
            cuda: 13-0
          - target: qwen
            cuda: 13-0
          - target: ltx
            cuda: 13-0
          - target: wan
            cuda: 13-0
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          targets: ${{ matrix.target }}-${{ matrix.cuda }}
          push: true
